[project]
name = "sources-simulator"
version = "0.1.0"
description = "Simulated third-party sources (Kafka and HTTP) for the alerting service"
requires-python = ">=3.11"
dependencies = [
  "faker>=30",
  "pyyaml>=6",
  "httpx>=0.27",
  "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sim = "sim.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sim"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
