# Sources Kafka cluster: where third-party systems (and later our simulator) publish `source.*` topics.
# Separate from the internal cluster in backend/kafka/. Only ingest reads it. Local use only.
# Run alone:   docker compose up -d      (from data/kafka-sources)
# Use from your own compose file:
#   include:
#     - path: ../../data/kafka-sources/docker-compose.yml   # adjust the relative path
# Then wait for topics:  depends_on: { kafka-sources-init: { condition: service_completed_successfully } }
# Addresses: inside compose `kafka-sources:9092`; from the host `localhost:9094`.
# Can run next to backend/kafka: different names, ports, volume and cluster id.
name: kafka-sources

services:
  kafka-sources:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9095"
    environment:
      # Fixed id, different from the internal cluster's, so tools never mix the two up.
      CLUSTER_ID: nxkIfvuRTPG5KnK5yVZjtw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-sources:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers. HOST: your machine (container port 9095, published as 9094).
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-sources:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created explicitly by kafka-sources-init, never by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker: every internal topic needs replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-sources-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka-sources:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates the source.* topics from contracts/data/sources.md, then exits. Safe to run again.
  kafka-sources-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-sources:
        condition: service_healthy
    volumes:
      - ./create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

volumes:
  kafka-sources-data:
