[project]
name = "processor"
version = "0.1.0"
description = "Processor service: schema mapping, rule evaluation, dedup"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.11",
    "redis>=5",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
