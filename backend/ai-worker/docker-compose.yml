# AI worker with the stub api, its own Postgres, and the processor stack (which brings Kafka), for local runs.
#   docker compose up -d --build        (from backend/ai-worker)
#   docker compose down -v              (stops everything, deletes the data)
include:
  - path: ../processor/docker-compose.yml

services:
  ai-worker-db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: alerts
      POSTGRES_DB: ai_worker
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - ai-worker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "alerts", "-d", "ai_worker"]
      interval: 2s
      timeout: 5s
      retries: 30

  # shortcut: stands in for backend/api until it serves the ai-worker's endpoints; then point API_URL there
  stub-api:
    build: &build
      context: .
      additional_contexts:
        processor: ../processor/processor
    command: ["python", "scripts/stub_api.py"]
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-worker:
    build: *build
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://alerts:alerts@ai-worker-db:5432/ai_worker
      API_URL: http://stub-api:8000/api
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ai-worker-db:
        condition: service_healthy
      stub-api:
        condition: service_started
    restart: unless-stopped

volumes:
  ai-worker-db-data:
