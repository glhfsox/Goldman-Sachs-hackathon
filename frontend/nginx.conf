# Serves the built UI and forwards /api and /ws to the API service, so the browser only ever talks to
# one origin (no CORS). API_UPSTREAM is set by the container (default api:8000, see Dockerfile).
server {
  listen 3000;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # A single-page app: every other path is the UI.
  location / {
    try_files $uri /index.html;
  }
}
