# Serves the built UI and forwards /api and /ws to the API service, so the browser only ever talks to
# one origin (no CORS). API_UPSTREAM is set by the container (default api:8000, see Dockerfile).
server {
  listen 3000;
  root /usr/share/nginx/html;

  # Docker's DNS, asked per request (through the variable below), so nginx starts even when the api
  # is not up yet and follows the api container when it is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://${API_UPSTREAM};

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # A single-page app: every other path is the UI.
  location / {
    try_files $uri /index.html;
  }
}
