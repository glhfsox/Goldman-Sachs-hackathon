name: pr
on: pull_request

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: PR gate
        env:
          BASE: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/team.py pr --base "origin/$BASE" --author "$AUTHOR"
