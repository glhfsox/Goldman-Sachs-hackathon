name: auto-merge
# Runs the pr-merger agent (Sonnet, high effort) on every teammate's PR, under the repo owner's Anthropic API key.
on:
  workflow_run:
    workflows: [pr]
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev  # rules come from dev, where they land first, not from the PR being judged
      - run: npm install -g @anthropic-ai/claude-code
      # plain Claude Code CLI on the API key instead of claude-code-action
      # merge and comment are allowed only for this PR, and merge only at this exact head (--merge is for release PRs dev -> main)
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "PR #$PR in $GITHUB_REPOSITORY, head SHA $SHA. Decide and act." \
            --agent pr-merger --model sonnet --effort high \
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(sleep:*),Bash(gh pr comment $PR --body:*),Bash(gh pr merge $PR --squash --delete-branch --match-head-commit $SHA),Bash(gh pr merge $PR --merge --match-head-commit $SHA)"
