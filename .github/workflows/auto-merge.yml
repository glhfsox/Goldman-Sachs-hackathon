name: auto-merge
# Runs the pr-merger agent (Sonnet, high effort) on every teammate's PR, under the repo owner's Claude token.
on:
  workflow_run:
    workflows: [pr]
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev  # rules come from dev, where they land first, not from the PR being judged
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "PR #${{ env.PR }} in ${{ github.repository }}, head SHA ${{ env.SHA }}. Decide and act."
          # merge and comment are allowed only for this PR, and merge only at this exact head (--merge is for release PRs dev -> main)
          claude_args: >-
            --agent pr-merger --model sonnet --effort high
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(sleep:*),Bash(gh pr comment ${{ env.PR }} --body:*),Bash(gh pr merge ${{ env.PR }} --squash --delete-branch --match-head-commit ${{ env.SHA }}),Bash(gh pr merge ${{ env.PR }} --merge --match-head-commit ${{ env.SHA }})"
